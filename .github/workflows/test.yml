name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Lint with tox
        run: uvx tox -e lint
      - uses: docker://rhysd/actionlint:1.7.7
        with:
          args: .github/workflows/test.yml src/nopt/workflow.yml
  tests:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Test with tox
        run: uvx tox
  companion:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nhairs/setuptools-git-metadata
          ref: fa190370b450943fe45fdec2a9312f8d592f6f1d
          path: .companion
      - uses: astral-sh/setup-uv@v3
      - name: Test companion integration with tox
        run: uvx tox -e companion
        env:
          NOPT_COMPANION_SOURCE: ${{ github.workspace }}/.companion
