name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv
      - run: uvx tox -e lint
      - uses: docker://rhysd/actionlint:1.7.7
        with:
          args: .github/workflows/test.yml src/nopt/workflow.yml
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv
      - run: uv sync --group dev
      - run: uv run pytest
  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nhairs/setuptools-git-metadata
          ref: fa190370b450943fe45fdec2a9312f8d592f6f1d
          path: .companion
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv
      - run: uv sync --group dev
      - run: uv run pytest tests/test_build.py::test_build_with_delivered_metadata_plugin
        env:
          NOPT_COMPANION_SOURCE: ${{ github.workspace }}/.companion
