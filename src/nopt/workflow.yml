# Editable starting point. Replace the CI placeholder before enabling publishing.
# Pin nopt and all actions to reviewed immutable revisions before production use.
name: Publish release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install nopt
        run: python -m pip install 'git+https://github.com/nhairs/nicks-opinionated-python-package-publishing-tool@main'
      - run: nopt ci-preflight
        env:
          GH_TOKEN: ${{ github.token }}
  ci:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Replace with project CI
        run: |
          echo '<your CI goes here>'
          exit 1
  build:
    needs: [preflight, ci]
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install 'git+https://github.com/nhairs/nicks-opinionated-python-package-publishing-tool@main'
      - id: build
        run: nopt build --output "$RUNNER_TEMP/release-bundle"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: bundle
        with:
          name: release-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-bundle/
          retention-days: 90
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi # For TestPyPI use its environment and configure repository in pyproject.toml.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install 'git+https://github.com/nhairs/nicks-opinionated-python-package-publishing-tool@main'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-bundle
      - run: nopt publish-release-preflight --bundle "$RUNNER_TEMP/release-bundle"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Copy verified distributions for upload and attestation generation
        run: cp -R "$RUNNER_TEMP/release-bundle/dist" "$RUNNER_TEMP/publish-dist"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: ${{ runner.temp }}/publish-dist/
          # For TestPyPI add repository-url: https://test.pypi.org/legacy/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: publication-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publish-dist/
          retention-days: 90
          if-no-files-found: warn
  github-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: python -m pip install 'git+https://github.com/nhairs/nicks-opinionated-python-package-publishing-tool@main'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-bundle
      - run: nopt publish-github-release --bundle "$RUNNER_TEMP/release-bundle"
        env:
          GH_TOKEN: ${{ github.token }}
